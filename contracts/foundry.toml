[profile.default]
src = "src"
script = "script"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"

[etherscan]
monad_testnet = { key = "", url = "https://sourcify-api-monad.blockvision.org/" }
